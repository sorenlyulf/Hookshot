  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python source checks (${{ matrix.distro }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            runner: ubuntu-24.04
    container: archlinux:latest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
         if matrix.distro == 'ubuntu'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check extraction boundaries
        run: python -I -B nx2/test_nup_paths.py
      - name: Check source-cache coherency
        run: python -I -B tests/test_make_game_cache.py
      - name: Check isolated child Unicode output
        run: python -I -B tests/test_child_unicode.py
      - name: Check packaged CPM discovery
        run: python -I -B tests/test_cpm_discovery.py
      - name: Check a failed step's error line
        run: python -I -B tests/test_failure_reason.py
      - name: C++ compiler for the import-hold check
        run: |
          if [ "${{ matrix.distro }}" = ubuntu ]; then
            apt-get update && sudo apt-get install -y g++
          else
            pacman -S --noconfirm --needed gcc python
          fi
      - name: Check failed-import backoff
        run: python -I -B tests/test_import_hold.py
      - name: Check the FPS counter's first sample
        run: python -I -B tests/test_fps_rate.py
      - name: Check a vertex stream is bound once
        run: python -I -B tests/test_vertex_bind.py
      - name: Check FPS overlay transfer ordering
        run: python -I -B tests/test_fps_overlay_order.py
      - name: Check dispatch timing stays off
        run: python -I -B tests/test_dispatch_clock.py
      - name: Check frame generation stays off until asked
        run: python -I -B tests/test_framegen_gate.py
      - name: Check the table-entry tracker stops looking
        run: python -I -B tests/test_table_track.py
      - name: Check descriptor timing stays off
        run: python -I -B tests/test_desc_clock.py
      - name: Check the replay clock skips the performance counter
        run: python -I -B tests/test_prof_clock.py
      - name: Check a pool span is reused without the lock
        run: python -I -B tests/test_pool_span.py
      - name: Check a captured page is read once
        run: python -I -B tests/test_submitted_page.py
      - name: Check uniform words skip a known gap
        run: python -I -B tests/test_ub_gap.py
      - name: Check a repeated uniform word is not read again
        run: python -I -B tests/test_ub_memo.py
      - name: Check a pass hazard skips textures that are not targets
        run: python -I -B tests/test_pass_hazard.py
      - name: Check a repeated read bind is not looked up again
        run: python -I -B tests/test_bind_memo.py
      - name: Check the shader list's text encoding
        run: python -I -B tests/test_shader_census_cmd.py
      - name: Check the build's version stamp
        run: python -I -B nx2/test_version.py
      - name: Check a repeated draw keeps its program and pipeline
        run: python -I -B tests/test_same_draw.py
      - name: Check the audio mixer's catch-up
        run: python -I -B tests/test_audio_deadline.py
      - name: Check controller rumble keeps going
        run: python -I -B tests/test_rumble_refresh.py
      - name: Check a repeated draw keeps its dynamic state
        run: python -I -B tests/test_same_dyn.py
      - name: Check upscale menu labels
        run: python -I -B tests/test_upscale_label.py
      - name: Check movie upscale fallback policy
        run: python -I -B tests/test_movie_upscale_policy.py
      - name: Check Alt+Enter is fullscreen, not Plus
        run: python -I -B tests/test_alt_enter.py
      - name: Check import windows
        run: python -I -B nx2/test_import_windows.py --cxx g++
      - name: Check a texture handle is looked up once
        run: python -I -B tests/test_handle_lookup.py
      - name: Check a repeated bind keeps its descriptors
        run: python -I -B tests/test_same_bind.py
      - name: Check the game launcher
        run: python -I -B tests/test_hookshot_launch.py

  spirv-global16:
    name: SPIR-V global halfword lowering (${{ matrix.distro }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            runner: ubuntu-24.04
    container: archlinux:latest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check out pinned SPIR-V headers
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: KhronosGroup/SPIRV-Headers
          ref: 496543121ce6419f23d6fa5d7194ba66c36212d2
          path: _deps/spirv-headers
          persist-credentials: false
      - name: Install Clang C++20, CMake and SPIR-V validator
        run: |
          if [ "${{ matrix.distro }}" = ubuntu ]; then
            apt-get update && sudo apt-get install -y clang spirv-tools
          else
            pacman -S --noconfirm --needed clang cmake spirv-tools
          fi
      - name: Configure the focused real-IR fixture
        run: >-
          CC=clang CXX=clang++ cmake -S tests/global_load_16 -B ${{ runner.temp }}/global-load-16
          -DREPO_ROOT=${{ github.workspace }}
          -DSPIRV_HEADERS_ROOT=${{ github.workspace }}/_deps/spirv-headers
      - name: Build the focused fixture
        run: cmake --build ${{ runner.temp }}/global-load-16 --parallel 2
      - name: Emit and inspect real IR modules
        run: ${{ runner.temp }}/global-load-16/global_load_16_ir ${{ runner.temp }}/global-load-16/modules
      - name: Validate every emitted module
        shell: bash
        run: |
          for module in "${{ runner.temp }}"/global-load-16/modules/*.spv; do
            spirv-val --target-env vulkan1.3 "$module"
          done
